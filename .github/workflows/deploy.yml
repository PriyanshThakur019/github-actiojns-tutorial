
name: Spring Boot CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build and test Spring Boot application
      - name: Build with Maven
        run: ./mvnw clean verify

      # Step 4: Build Docker image
      - name: Build Docker image
        run: docker build -t github-actions-tutorial .
